spring.application.name=delivery-platform

server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/delivery_platform
spring.datasource.username=postgres
spring.datasource.password=tippu555

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
jwt.secret=delivery-platform-super-secret-key-change-this-in-production-123456789
jwt.expiration=86400000
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Production Dispatch Engine Configuration
# Maximum straight-line search radius in km for finding drivers
dispatch.max-search-radius-km=20.0
# Driver offer timeout: seconds before an unaccepted offer expires and re-dispatches
dispatch.assignment-timeout-seconds=45
# Background retry interval for searching orders
dispatch.retry-interval-ms=5000
# Base vehicle speed (km/h) in urban conditions
dispatch.urban-base-speed-kmh=28.0
# Road network detour factor (actual road km / haversine straight line km)
dispatch.road-detour-factor=1.35
# Pickup buffer minutes for driver vehicle preparation & parking
dispatch.pickup-buffer-minutes=2.0
# Pluggable external OSRM routing server (optional)
dispatch.osrm-enabled=false
dispatch.osrm-url=